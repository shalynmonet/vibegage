<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vibegage OBS Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;background:transparent;overflow:hidden;font-family:Manrope,system-ui,sans-serif;color:#fff}.scoreboard{position:absolute;left:64px;bottom:60px;width:770px;filter:drop-shadow(0 14px 35px #05030ccc);animation:enter .7s cubic-bezier(.18,.9,.25,1.1) both}.topline{display:flex;align-items:center;gap:10px;padding:0 0 12px 7px;font:500 13px 'DM Mono',monospace;letter-spacing:2px;color:#f5f1ff;text-transform:uppercase}.live{width:8px;height:8px;border-radius:50%;background:#c5fa79;box-shadow:0 0 13px #c5fa79;animation:blink 1.6s infinite}.score{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.tile{position:relative;min-height:117px;border-radius:14px;padding:15px 17px 13px;background:linear-gradient(145deg,#201d2dee,#13111bee);border:1px solid #ffffff24;overflow:hidden;backdrop-filter:blur(12px);transition:transform .3s,border-color .3s}.tile:before{content:'';position:absolute;right:-30px;top:-55px;width:120px;height:120px;background:var(--accent,#c5fa79);opacity:.21;filter:blur(38px)}.tile.winner{border-color:color-mix(in srgb,var(--accent,#c5fa79) 75%,transparent);transform:translateY(-4px);animation:pop .6s ease both}.label{position:relative;color:#a9a5ba;font:10px 'DM Mono',monospace;letter-spacing:1.25px;text-transform:uppercase}.streamer{position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:19px;font-weight:800;margin-top:9px;letter-spacing:-.5px}.metric{position:relative;color:var(--accent,#c5fa79);font:11px 'DM Mono',monospace;margin-top:5px}.footer{display:flex;justify-content:space-between;color:#d1cddc;font:10px 'DM Mono',monospace;padding:9px 7px 0;text-shadow:0 2px 8px #000}.spark{display:inline-block;animation:twinkle 1.7s ease-in-out infinite}.none{color:#d7d2e2}.hide{display:none}@keyframes enter{from{opacity:0;transform:translateY(28px) scale(.96)}to{opacity:1;transform:none}}@keyframes blink{50%{opacity:.35;box-shadow:0 0 3px #c5fa79}}@keyframes pop{0%{transform:translateY(0) scale(.98)}45%{transform:translateY(-7px) scale(1.015)}100%{transform:translateY(-4px) scale(1)}}@keyframes twinkle{50%{transform:rotate(24deg) scale(1.3);color:#ff6ba9}}
  </style>
</head>
<body>
  <section class="scoreboard" aria-label="Live collab chat scoreboard">
    <div class="topline"><span class="live"></span> CHAT VS CHAT <span class="spark">✦</span></div>
    <div class="score" id="score"><div class="tile"><div class="label">HEAVIEST MOTION</div><div class="streamer">Waiting on chat…</div><div class="metric">— messages</div></div><div class="tile"><div class="label">HEAVIEST AURA</div><div class="streamer">Loading…</div><div class="metric">— vibe</div></div><div class="tile"><div class="label">MOST CONFUSED</div><div class="streamer">Loading…</div><div class="metric">— questions</div></div></div>
    <div class="footer"><span id="moment">THE COLLAB VIBE CHECK</span><span>vibegage.app</span></div>
  </section>
  <script type="module" src="/overlay.js"></script>
</body>
</html>
